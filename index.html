<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 七夕 · 牛郎织女</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body {
            background: #0a0518;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        canvas { display: block; cursor: pointer; touch-action: none; }
        #message {
            position: absolute;
            color: #ffe6f0;
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            text-shadow: 0 0 30px rgba(255,100,150,0.9), 0 0 60px rgba(255,50,100,0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
            text-align: center;
            font-weight: bold;
            letter-spacing: 4px;
            line-height: 1.8;
            width: 85%;
            max-width: 700px;
            z-index: 10;
        }
        #message span { display: inline-block; animation: twinkle 1.8s infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        #photo-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 70%;
            max-width: 450px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 20;
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(255,100,150,0.6), 0 0 120px rgba(255,50,100,0.3);
            border: 4px solid rgba(255,200,230,0.8);
            background: rgba(255,240,245,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px;
        }
        #photo-frame.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #photo-frame img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            display: block;
            background: #1a0a20;
        }
        #photo-frame .caption {
            text-align: center;
            color: #ffe6f0;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            margin-top: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,100,150,0.5);
        }
        #hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255,200,230,0.35);
            font-size: clamp(0.7rem, 1.8vw, 0.95rem);
            letter-spacing: 2px;
            background: rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,200,230,0.1);
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }
        /* ===== 星星标签统一样式（修复文字溢出） ===== */
        .star-label {
            position: absolute;
            color: rgba(255,255,200,0.85);
            font-size: clamp(0.9rem, 2.2vw, 1.1rem);
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255,200,100,0.8);
            background: rgba(0,0,0,0.5);
            /* 加大左右内边距，文字不会顶边裁切 */
            padding: 6px 26px !important;
            border-radius: 30px;
            border: 1px solid rgba(255,215,0,0.3);
            z-index: 15;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: manipulation;
            display: inline-block;
            white-space: nowrap !important;
            max-width: none !important;
            width: auto !important;
            overflow: visible !important;
            box-sizing: border-box;
        }
        .star-label:hover {
            background: rgba(255,200,100,0.25);
            border-color: rgba(255,215,0,0.8);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,200,100,0.3);
        }
        .star-label:active {
            transform: scale(0.95);
        }
        /* 移除织女星错误right定位，统一left布局 */
        #labelVega {
            font-size: clamp(0.95rem, 2.3vw, 1.15rem) !important;
            letter-spacing: 2px !important;
        }
        #music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,200,230,0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #ffe6f0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255,100,150,0.2);
            user-select: none;
            touch-action: manipulation;
        }
        #music-control:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
            border-color: rgba(255,200,230,0.8);
        }
        #music-control.playing {
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255,100,150,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,100,150,0.8); }
            100% { box-shadow: 0 0 20px rgba(255,100,150,0.3); }
        }
    </style>
</head>
<body>
    <div id="message">
        <span>🌉 鹊桥相会 · 点击星宿</span><br>
        <span style="font-size:clamp(1rem, 4vw, 1.6rem);">💕 看看谁在等你</span>
    </div>
    <div id="photo-frame">
        <img id="photoImg" src="" alt="照片" onerror="this.style.display='none'">
        <div id="photoCaption" class="caption">✨ 我们的银河</div>
    </div>
    <div id="hint">✨ 点击星星 → 专属照片 &nbsp;|&nbsp; 点击画布 → 流星雨</div>
    <!-- 牛郎星 & 织女星 -->
    <div class="star-label" id="labelAltair">⭐ 牛郎星</div>
    <div class="star-label" id="labelVega">⭐ 织女星</div>
    <div id="music-control" title="点击播放/暂停音乐">🔇</div>
    <canvas id="canvas"></canvas>
    <audio id="bg-music" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    
    <script>
        // ============================================================
        //  1. 音乐控制
        // ============================================================
        const audio = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-control');
        function toggleMusic() {
            if (audio.paused) {
                audio.play().catch(() => {});
                musicBtn.textContent = '🎵';
                musicBtn.classList.add('playing');
            } else {
                audio.pause();
                musicBtn.textContent = '🔇';
                musicBtn.classList.remove('playing');
            }
        }
        musicBtn.addEventListener('click', e => {
            e.stopPropagation();
            toggleMusic();
        });
        // 页面任意点击自动播放音乐
        const audioPlayHandler = () => {
            if (audio.paused && audio.src) {
                audio.play().then(() => {
                    musicBtn.textContent = '🎵';
                    musicBtn.classList.add('playing');
                }).catch(() => {});
            }
            document.removeEventListener('click', audioPlayHandler);
        };
        document.addEventListener('click', audioPlayHandler);

        // ============================================================
        //  2. 画布初始化
        // ============================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        // 牛郎织女坐标
        const starAltair = { x: W * 0.12, y: H * 0.15 };
        const starVega = { x: W * 0.85, y: H * 0.78 };

        // 更新标签位置（统一left计算，不再用right导致溢出）
        function updateStarLabels() {
            const l1 = document.getElementById('labelAltair');
            const l2 = document.getElementById('labelVega');
            l1.style.left = `${starAltair.x - l1.offsetWidth / 2}px`;
            l1.style.top = `${starAltair.y - 30}px`;
            l2.style.left = `${starVega.x - l2.offsetWidth / 2}px`;
            l2.style.top = `${starVega.y - 30}px`;
        }
        updateStarLabels();

        // ---------- 流星类（爱心强制全程渲染，修复消失问题） ----------
        class Meteor {
            constructor(x, y, angle, speed, length, color) {
                this.x = x || Math.random() * W;
                this.y = y || 0;
                this.angle = angle || (Math.PI / 4) + (Math.random() * 0.8 - 0.4);
                this.speed = speed || 8 + Math.random() * 12;
                this.length = length || 90 + Math.random() * 80;
                this.color = color || `hsl(${320 + Math.random() * 30}, 90%, 70%)`;
                this.life = 1;
                this.decay = 0.004 + Math.random() * 0.012;
                this.active = true;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life -= this.decay;
                if (this.life <= 0 || this.x > W + 200 || this.y > H + 200) {
                    this.active = false;
                }
            }
            draw(ctx) {
                const tail = this.length * this.life;
                const grad = ctx.createLinearGradient(
                    this.x, this.y,
                    this.x - Math.cos(this.angle) * tail,
                    this.y - Math.sin(this.angle) * tail
                );
                grad.addColorStop(0, 'rgba(255,255,255,1)');
                grad.addColorStop(0.2, this.color);
                grad.addColorStop(1, 'rgba(255,150,200,0)');
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * tail, this.y - Math.sin(this.angle) * tail);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 3.5 * this.life;
                ctx.stroke();

                // 流星头部光点
                ctx.shadowBlur = 30;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4 * this.life, 0, Math.PI * 2);
                ctx.fillStyle = '#fff9e6';
                ctx.fill();

                // 修复爱心：life极低也能显示，不会中途消失
                ctx.font = '16px Arial';
                ctx.fillStyle = '#ff4d7a';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff4d7a';
                ctx.globalAlpha = Math.max(this.life, 0.15);
                ctx.fillText('❤️', this.x - 12, this.y - 24);
                ctx.globalAlpha = 1;

                ctx.shadowBlur = 0;
            }
        }

        // 星空背景星星
        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                r: 0.5 + Math.random() * 2,
                a: Math.random() * Math.PI * 2,
                speed: 0.01 + Math.random() * 0.02
            });
        }

        const meteors = [];
        // 批量生成流星雨
        function createShower(count = 35) {
            for (let i = 0; i < count; i++) {
                const x = Math.random() * W * 0.8 + W * 0.1;
                const y = Math.random() * H * 0.3;
                const angle = Math.PI / 4 + (Math.random() * 0.8 - 0.4);
                const speed = 7 + Math.random() * 14;
                const hue = 320 + Math.random() * 30;
                const m = new Meteor(x, y, angle, speed, 80 + Math.random() * 80, `hsl(${hue}, 90%, 70%)`);
                m.decay = 0.003 + Math.random() * 0.01;
                meteors.push(m);
            }
        }

        // ============================================================
        //  修复：持续流星生成逻辑，稳定不卡顿、不停止
        // ============================================================
        // 页面初始化预加载一批流星
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const x = Math.random() * W;
                const y = Math.random() * H * 0.2;
                const m = new Meteor(x, y, Math.PI / 4 + (Math.random() * 0.6 - 0.3), 5 + Math.random() * 10, 70 + Math.random() * 60);
                m.decay = 0.004 + Math.random() * 0.012;
                meteors.push(m);
            }, i * 80);
        }

        // 稳定定时器：每500ms生成1颗，永不中断
        setInterval(() => {
            const x = Math.random() * W * 0.9 + W * 0.05;
            const y = Math.random() * H * 0.2;
            const m = new Meteor(x, y, Math.PI / 4 + (Math.random() * 0.6 - 0.3), 6 + Math.random() * 10, 80 + Math.random() * 60);
            m.decay = 0.004 + Math.random() * 0.012;
            meteors.push(m);
        }, 500);

        // 点击画布爆发流星雨
        canvas.addEventListener('click', e => {
            createShower(45);
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 7;
                const len = 50 + Math.random() * 60;
                const hue = 330 + Math.random() * 30;
                const m = new Meteor(e.clientX, e.clientY, angle, speed, len, `hsl(${hue}, 90%, 70%)`);
                m.decay = 0.02 + Math.random() * 0.025;
                meteors.push(m);
            }
            // 轻微晃动牛郎织女坐标
            starAltair.x = W * 0.12 + (Math.random() - 0.5) * 40;
            starAltair.y = H * 0.15 + (Math.random() - 0.5) * 30;
            starVega.x = W * 0.85 + (Math.random() - 0.5) * 40;
            starVega.y = H * 0.78 + (Math.random() - 0.5) * 30;
            updateStarLabels();

            const msg = document.getElementById('message');
            msg.innerHTML = '<span>🌠 流星雨 · 爱意永不停</span>';
            msg.style.opacity = 1;
            setTimeout(() => msg.style.opacity = 0, 2000);
        });

        // ---------- 照片弹窗逻辑 ----------
        let photoTimer = null;
        function showPhoto(imgSrc, captionText, showMessage) {
            const frame = document.getElementById('photo-frame');
            const img = document.getElementById('photoImg');
            const cap = document.getElementById('photoCaption');
            img.src = imgSrc;
            img.style.display = 'block';
            cap.textContent = captionText || '✨ 我们的银河';
            frame.classList.add('show');

            if (showMessage) {
                const msg = document.getElementById('message');
                msg.innerHTML = showMessage;
                msg.style.opacity = 1;
                setTimeout(() => msg.style.opacity = 0, 3500);
            }
            clearTimeout(photoTimer);
            photoTimer = setTimeout(() => {
                frame.classList.remove('show');
            }, 4000);
        }

        // 点击牛郎/织女标签
        document.getElementById('labelAltair').addEventListener('click', e => {
            e.stopPropagation();
            createShower(20);
            showPhoto(
                'boy.jpg',
                '⭐ 牛郎 · 永远等你',
                '<span>⭐ 牛郎星 · 是我</span><br><span style="font-size:clamp(1rem, 4vw, 1.6rem);">❤️ 我一直都在</span>'
            );
        });
        document.getElementById('labelVega').addEventListener('click', e => {
            e.stopPropagation();
            createShower(20);
            showPhoto(
                'girl.jpg',
                '🌠 织女 · 最美遇见',
                '<span>🌠 织女星 · 是你</span><br><span style="font-size:clamp(1rem, 4vw, 1.6rem);">💖 我的全部风景</span>'
            );
        });

        // ---------- 主渲染循环 ----------
        function animate() {
            ctx.clearRect(0, 0, W, H);
            // 银河径向渐变背景
            const grad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, Math.max(W, H) * 0.8);
            grad.addColorStop(0, 'rgba(30,20,50,0.3)');
            grad.addColorStop(0.5, 'rgba(10,5,30,0.5)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 绘制背景星星
            for (const s of stars) {
                s.a += s.speed;
                const alpha = 0.5 + 0.5 * Math.sin(s.a);
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,240,250,${alpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffb6c1';
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 流星更新+绘制，清理失效流星（避免数组堆积卡顿）
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                if (!m.active) {
                    meteors.splice(i, 1);
                    continue;
                }
                m.update();
                m.draw(ctx);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // 窗口缩放自适应
        window.addEventListener('resize', () => {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            starAltair.x = W * 0.12;
            starAltair.y = H * 0.15;
            starVega.x = W * 0.85;
            starVega.y = H * 0.78;
            updateStarLabels();
        });

        // 移动端触摸转发点击事件
        canvas.addEventListener('touchstart', e => {
            const touch = e.touches[0];
            canvas.dispatchEvent(new MouseEvent('click', {
                clientX: touch.clientX,
                clientY: touch.clientY
            }));
        }, { passive: true });
    </script>
</body>
</html>
